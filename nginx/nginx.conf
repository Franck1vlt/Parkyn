server {
    listen 80;

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Identifiant de requête généré par nginx : l'API le valide, le met dans ses logs (MDC) et le renvoie dans
        # l'en-tête de réponse X-Request-Id. Il remplace toute valeur envoyée par le client.
        proxy_set_header X-Request-Id $request_id;
    }
}
