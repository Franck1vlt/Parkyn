services:
  db:
    image: postgres:16
    container_name: parkyn-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - parkyn_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./parkyn-api
    container_name: parkyn-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-3600000}
      - REFRESH_EXPIRATION_DAYS=${REFRESH_EXPIRATION_DAYS:-1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - parkyn_network

  web:
    build: ./parkyn-web
    container_name: parkyn-web
    command: ng serve --host 0.0.0.0 --port 5000 --allowed-hosts all
    env_file:
      - .env
    environment:
      - API_URL=${API_URL}
    ports:
      - "5000:5000"
    volumes:
      - ./parkyn-web:/app
      - /app/node_modules
    networks:
      - parkyn_network

volumes:
  postgres_data:

networks:
  parkyn_network:
    driver: bridge
