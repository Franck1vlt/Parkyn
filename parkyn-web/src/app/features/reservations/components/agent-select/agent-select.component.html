<div class="relative">
  <input
    type="text"
    [value]="selectedAgentName"
    (input)="onSearch($event)"
    placeholder="Rechercher un agent..."
    class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent"
  />

  @if (isLoading) {
    <p
      class="absolute top-full left-0 w-full mt-1 px-4 py-3 text-sm text-gray-400 bg-white border border-gray-200 rounded-lg shadow-lg"
    >
      Recherche...
    </p>
  }

  <ul
    *ngIf="filteredAgents.length > 0"
    class="absolute top-full left-0 w-full z-10 bg-white shadow-lg rounded-lg border border-gray-200 mt-1"
  >
    <li
      *ngFor="let agent of filteredAgents"
      (click)="onSelect(agent)"
      class="flex items-center gap-3 px-4 py-3 hover:bg-gray-50 cursor-pointer"
    >
      <div
        class="w-8 h-8 rounded-full bg-orange-100 text-orange-700 flex items-center justify-center text-xs font-bold shrink-0"
      >
        {{ agent.firstname[0] }}{{ agent.lastname[0] }}
      </div>
      <span class="text-sm text-gray-800">{{ agent.firstname }} {{ agent.lastname }}</span>
    </li>
  </ul>
</div>
