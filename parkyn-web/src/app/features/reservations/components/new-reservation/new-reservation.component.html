<app-header />
<main class="min-h-screen py-8 px-4 bg-gray-100">
  <div class="max-w-3xl mx-auto">
    <!-- Bouton retour -->
    <button
      type="button"
      routerLink="/reservations"
      class="flex items-center gap-2 mb-6 text-gray-600 hover:text-orange-600 hover:bg-orange-100 transition-colors py-2 px-3 rounded-2xl border-2"
    >
      <svg
        class="w-6 h-6"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 8 14"
      >
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M7 1 1.3 6.326a.91.91 0 0 0 0 1.348L7 13"
        />
      </svg>
      Retour aux réservations
    </button>

    <div class="bg-white rounded-2xl shadow-lg p-8">
      <div class="mb-0 flex justify-center">
        <img src="img/parkyn.png" alt="Logo Parkyn" class="w-24 h-auto" />
      </div>
      <h2 class="text-2xl font-bold text-gray-800 mb-8 flex items-center justify-center">
        Nouvelle Réservation
      </h2>

      <form [formGroup]="reservationForm" (ngSubmit)="onSubmit()">
        <!-- Section Agent -->
        <div class="mb-8">
          <h3 class="text-xs font-semibold text-orange-400 uppercase tracking-widest mb-4">
            Agent de réservation
          </h3>
          @if (isAdmin) {
            <div class="mb-4">
              <label class="block mb-1.5 text-sm font-medium text-gray-700"
                >Rechercher un agent</label
              >
              <app-agent-select (agentSelected)="onAgentSelected($event)" />
            </div>
          }
        </div>

        <!-- Section Conducteur -->
        <div class="mb-8">
          <h3 class="text-xs font-semibold text-orange-400 uppercase tracking-widest mb-4">
            Conducteur
          </h3>
          <div class="mb-4">
            <label class="block mb-1.5 text-sm font-medium text-gray-700"
              >Rechercher un conducteur</label
            >
            <app-driver-select (driverSelected)="onDriverSelected($event)" />
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block mb-1.5 text-sm font-medium text-gray-700">Prénom</label>
              <input
                type="text"
                formControlName="driverFirstName"
                class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                placeholder="Rempli automatiquement"
              />
            </div>
            <div>
              <label class="block mb-1.5 text-sm font-medium text-gray-700">Nom</label>
              <input
                type="text"
                formControlName="driverLastName"
                class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                placeholder="Rempli automatiquement"
              />
            </div>
          </div>
        </div>

        <hr class="border-gray-500 mb-8" />

        <!-- Section Période -->
        <div class="mb-8">
          <h3 class="text-xs font-semibold text-orange-400 uppercase tracking-widest mb-4">
            Période
          </h3>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block mb-1.5 text-sm font-medium text-gray-700">Date de début</label>
              <input
                type="date"
                formControlName="startDate"
                class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent"
              />
            </div>
            <div>
              <label class="block mb-1.5 text-sm font-medium text-gray-700">Date de fin</label>
              <input
                type="date"
                formControlName="endDate"
                class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent"
              />
            </div>
          </div>
        </div>

        <hr class="border-gray-500 mb-8" />

        <!-- Section Véhicule -->
        <div class="mb-8">
          <h3 class="text-xs font-semibold text-orange-400 uppercase tracking-widest mb-4">
            Véhicule
          </h3>
          <div class="mb-4">
            <label class="block mb-1.5 text-sm font-medium text-gray-700">Choix du véhicule</label>
            <app-vehicle-select (vehicleSelected)="onVehicleSelected($event)" />
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block mb-1.5 text-sm font-medium text-gray-700">État du véhicule</label>
              <app-condition-select (conditionChange)="onConditionChange($event)" />
            </div>
            <div>
              <label class="block mb-1.5 text-sm font-medium text-gray-700"
                >Kilométrage au départ</label
              >
              <input
                type="number"
                formControlName="mileageStart"
                class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                placeholder="0"
                min="0"
              />
            </div>
          </div>
        </div>

        <hr class="border-gray-500 mb-8" />

        <!-- Section Remarques -->
        <div class="mb-8">
          <h3 class="text-xs font-semibold text-orange-400 uppercase tracking-widest mb-4">
            Remarques
          </h3>
          <textarea
            formControlName="notesBefore"
            rows="4"
            class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent resize-none"
            placeholder="Remarques avant la location..."
          ></textarea>
        </div>

        <!-- Actions -->
        <div class="flex justify-end">
          @if (errorMessage) {
            <p class="text-red-600 text-sm mb-4">{{ errorMessage }}</p>
          }
          <button
            type="submit"
            [disabled]="reservationForm.invalid || isSubmitting"
            class="bg-orange-600 text-white px-6 py-2.5 rounded-lg font-medium hover:bg-orange-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
          >
            {{ isSubmitting ? 'Création...' : 'Créer la réservation' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</main>
