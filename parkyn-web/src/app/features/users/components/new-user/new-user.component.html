<app-header />
<main class="min-h-screen py-8 px-4 bg-gray-100">
  <div class="max-w-3xl mx-auto">
    <!-- Bouton retour -->
    <button
      type="button"
      routerLink="/users"
      class="flex items-center gap-2 mb-6 text-gray-600 hover:text-orange-600 hover:bg-orange-100 transition-colors py-2 px-3 rounded-2xl border-2"
    >
      <svg
        class="w-6 h-6"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 8 14"
      >
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M7 1 1.3 6.326a.91.91 0 0 0 0 1.348L7 13"
        />
      </svg>
      Retour aux utilisateurs
    </button>

    <div class="bg-white rounded-2xl shadow-lg p-8">
      <div class="mb-0 flex justify-center">
        <img src="img/parkyn.png" alt="Logo Parkyn" class="w-24 h-auto" />
      </div>
      <h2 class="text-2xl font-bold text-gray-800 mb-8 flex items-center justify-center">
        Nouvel utilisateur
      </h2>

      <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
        <!-- Section Utilisateur -->
        <div class="mb-8">
          <h3 class="text-xs font-semibold text-orange-400 uppercase tracking-widest mb-4">
            Utilisateur
          </h3>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block mb-1.5 text-sm font-medium text-gray-700">Prénom</label>
              <input
                type="text"
                formControlName="firstname"
                class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                placeholder="John"
              />
            </div>
            <div>
              <label class="block mb-1.5 text-sm font-medium text-gray-700">Nom</label>
              <input
                type="text"
                formControlName="lastname"
                class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                placeholder="Doe"
              />
            </div>
            <div>
              <label class="block mb-1.5 text-sm font-medium text-gray-700">Email</label>
              <input
                type="email"
                formControlName="email"
                class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                placeholder="john.doe@parkyn.app"
              />
            </div>
            <div>
              <label class="block mb-1.5 text-sm font-medium text-gray-700">Mot de passe</label>
              <div class="relative">
                <input
                  [type]="showPassword ? 'text' : 'password'"
                  formControlName="password"
                  class="w-full px-3 py-2.5 pr-10 text-sm border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-orange-500"
                />
                <button
                  type="button"
                  (click)="showPassword = !showPassword"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
                >
                  @if (showPassword) {
                    <!-- eye-slash -->
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke-width="1.5"
                      stroke="currentColor"
                      class="size-5"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"
                      />
                    </svg>
                  } @else {
                    <!-- eye -->
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke-width="1.5"
                      stroke="currentColor"
                      class="size-5"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                      />
                    </svg>
                  }
                </button>
              </div>
            </div>
            <div>
              <label class="block mb-1.5 text-sm font-medium text-gray-700"
                >Confirmer le mot de passe</label
              >
              <div class="relative">
                <input
                  [type]="showConfirmPassword ? 'text' : 'password'"
                  formControlName="confirmPassword"
                  class="w-full px-3 py-2.5 pr-10 text-sm border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-orange-500"
                />
                <button
                  type="button"
                  (click)="showConfirmPassword = !showConfirmPassword"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
                >
                  @if (showConfirmPassword) {
                    <!-- eye-slash -->
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke-width="1.5"
                      stroke="currentColor"
                      class="size-5"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"
                      />
                    </svg>
                  } @else {
                    <!-- eye -->
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke-width="1.5"
                      stroke="currentColor"
                      class="size-5"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                      />
                    </svg>
                  }
                </button>
              </div>
            </div>
            <div>
              <label class="block mb-1.5 text-sm font-medium text-gray-700">Rôle</label>
              <select
                formControlName="role"
                class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-orange-500"
              >
                <option value="">Sélectionner un rôle</option>
                <option value="ADMIN">Admin</option>
                <option value="AGENT">Agent</option>
                <option value="DRIVER">Conducteur</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Actions -->
        @if (errorMessage) {
          <p class="text-red-600 text-sm mb-4 text-right">{{ errorMessage }}</p>
        }
        <div class="flex justify-end">
          <button
            type="submit"
            [disabled]="userForm.invalid || isSubmitting"
            class="bg-orange-600 text-white px-6 py-2.5 rounded-lg font-medium hover:bg-orange-700 transition-colors disabled:bg-orange-300 disabled:cursor-not-allowed"
          >
            {{ isSubmitting ? 'Création...' : "Créer l'utilisateur" }}
          </button>
        </div>
      </form>
    </div>
  </div>
</main>
