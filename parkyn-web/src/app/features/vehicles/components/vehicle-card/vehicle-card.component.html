<div
  class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 hover:shadow-md hover:border-orange-200 transition-all"
>
  <!-- En-tête -->
  <div class="flex items-start justify-between mb-3">
    <a [routerLink]="['/vehicles', vehicle.id]" class="flex-1">
      <p class="text-lg font-bold text-gray-800">{{ vehicle.brand }} {{ vehicle.model }}</p>
      <p class="text-sm font-mono text-gray-400">{{ vehicle.plateNumber }}</p>
    </a>
    <span [class]="statusClass">
      {{ statusLabel }}
    </span>
  </div>

  <!-- Infos secondaires -->
  <div class="flex items-center gap-2 text-sm text-gray-500 mb-4">
    <span>{{ vehicle.year }}</span>
    <span>·</span>
    <span>{{ vehicle.mileageKM | number: '1.0-0' }} km</span>
  </div>

  <!-- Actions -->
  <div class="flex justify-end gap-3 pt-3 border-t border-gray-100">
    <a [routerLink]="['/vehicles', vehicle.id]" class="text-gray-500 hover:text-orange-600">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-5"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
        />
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
        />
      </svg>
    </a>
    <button
      type="button"
      (click)="onDelete.emit(vehicle.id)"
      class="text-gray-500 hover:text-red-600"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-5"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
        />
      </svg>
    </button>
  </div>
</div>
