<app-header />
<main class="min-h-screen py-8 px-4 bg-gray-100">
  <div class="max-w-3xl mx-auto">
    <!-- Bouton retour -->
    <button
      type="button"
      routerLink="/vehicles"
      class="flex items-center gap-2 mb-6 text-gray-600 hover:text-orange-600 hover:bg-orange-100 transition-colors py-2 px-3 rounded-2xl border-2"
    >
      <svg
        class="w-6 h-6"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 8 14"
      >
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M7 1 1.3 6.326a.91.91 0 0 0 0 1.348L7 13"
        />
      </svg>
      Retour aux véhicules
    </button>

    <div class="bg-white rounded-2xl shadow-lg p-8">
      <div class="mb-0 flex justify-center">
        <img src="img/parkyn.png" alt="Logo Parkyn" class="w-24 h-auto" />
      </div>
      <h2 class="text-2xl font-bold text-gray-800 mb-8 flex items-center justify-center">
        Nouveau Véhicule
      </h2>

      <form [formGroup]="vehicleForm" (ngSubmit)="onSubmit()">
        <!-- Section Véhicule -->
        <div class="mb-8">
          <h3 class="text-xs font-semibold text-orange-400 uppercase tracking-widest mb-4">
            Véhicule
          </h3>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block mb-1.5 text-sm font-medium text-gray-700">Marque</label>
              <input
                type="text"
                formControlName="brand"
                class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                placeholder="Renault"
              />
            </div>
            <div>
              <label class="block mb-1.5 text-sm font-medium text-gray-700">Modèle</label>
              <input
                type="text"
                formControlName="model"
                class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                placeholder="Clio"
              />
            </div>
            <div>
              <label class="block mb-1.5 text-sm font-medium text-gray-700">Année</label>
              <input
                type="number"
                formControlName="year"
                class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                placeholder="2026"
              />
            </div>
            <div>
              <label class="block mb-1.5 text-sm font-medium text-gray-700">Immatriculation</label>
              <input
                type="text"
                formControlName="plateNumber"
                class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                placeholder="AB-123-CD"
              />
            </div>
            <div>
              <label class="block mb-1.5 text-sm font-medium text-gray-700">Kilométrage</label>
              <input
                type="number"
                formControlName="mileageKM"
                class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                placeholder="0"
                min="0"
              />
            </div>
            <div>
              <label class="block mb-1.5 text-sm font-medium text-gray-700"
                >Mise en service le</label
              >
              <input
                type="date"
                formControlName="commissionedAt"
                class="w-full px-3 py-2.5 text-sm border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent"
              />
            </div>
          </div>
        </div>

        <!-- Actions -->
        @if (errorMessage) {
          <p class="text-red-600 text-sm mb-4 text-right">{{ errorMessage }}</p>
        }
        <div class="flex justify-end">
          <button
            type="submit"
            [disabled]="vehicleForm.invalid || isSubmitting"
            class="bg-orange-600 text-white px-6 py-2.5 rounded-lg font-medium hover:bg-orange-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
          >
            {{ isSubmitting ? 'Création...' : 'Créer le véhicule' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</main>
