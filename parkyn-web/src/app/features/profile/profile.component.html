<app-header />
<main class="min-h-screen py-8 pw-4 bg-gray-100">
  <div class="max-w-4xl mx-auto">
    <!-- Bouton retour -->
    <button
      type="button"
      routerLink="/"
      class="flex items-center gap-2 mb-6 text-gray-600 hover:text-orange-600 hover:bg-orange-100 transition-colors py-2 px-3 rounded-2xl border-2"
    >
      <svg
        class="w-6 h-6"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 8 14"
      >
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M7 1 1.3 6.326a.91.91 0 0 0 0 1.348L7 13"
        />
      </svg>
      Retour à l'accueil
    </button>

    <!-- Header du profil -->
    <div class="bg-white rounded-2xl shadow-lg overflow-hidden mb-6">
      <!-- Bandeau -->
      <div class="z-0 h-36 bg-gradient-to-r from-orange-900 to-orange-400 relative overflow-hidden">
        <div
          class="absolute -top-6 left-1/3 w-40 h-40 bg-orange-300 rounded-full opacity-40 blur-3xl"
        ></div>
        <div
          class="absolute top-4 right-1/4 w-48 h-48 bg-orange-400 rounded-full opacity-30 blur-3xl"
        ></div>
        <div
          class="absolute -bottom-8 left-1/2 w-36 h-36 bg-orange-800 rounded-full opacity-50 blur-2xl"
        ></div>
      </div>

      <!-- Contenu centré -->
      <div class="relative z-10 flex flex-col items-center -mt-12 pb-8 px-6">
        <!-- Avatar -->
        <div
          class="w-24 h-24 rounded-full border-4 border-white shadow-lg flex items-center justify-center text-white text-3xl font-bold"
          [ngClass]="roleAccentColor"
        >
          {{ initials }}
        </div>

        <!-- Nom -->
        <h1 class="mt-3 text-2xl font-bold text-gray-800">{{ userName }}</h1>

        <!-- Badge rôle -->
        <span
          [class]="
            'mt-1 inline-block px-3 py-1 rounded-full text-sm font-semibold border ' +
            roleBadgeColor
          "
        >
          {{ userRole }}
        </span>

        <!-- Email -->
        <p class="mt-2 text-gray-500 text-sm">{{ userEmail }}</p>
      </div>
    </div>

    <!-- Permissions -->
    <div class="bg-white rounded-2xl shadow-sm p-6 mt-4">
      <div class="flex items-center gap-2 mb-4">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6 text-orange-800"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"
          />
        </svg>
        <p class="text-lg font-bold text-black uppercase tracking-widest">Vos permissions</p>
      </div>
      <div class="grid grid-cols-2 gap-4">
        @for (p of permissions; track p.label) {
          <div
            class="flex items-center gap-4 p-3 rounded-xl"
            [class]="
              p.allowed
                ? 'bg-green-50 border-2 border-green-300'
                : 'bg-red-50 border-2 border-red-300'
            "
          >
            @if (p.allowed) {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke="currentColor"
                class="size-5 text-green-600 shrink-0"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
              </svg>
            } @else {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-5 text-red-500 shrink-0"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
              </svg>
            }
            <div>
              <p class="text-sm font-semibold text-gray-800">
                {{ p.label }}
              </p>
              <p class="text-xs text-gray-400">{{ p.description }}</p>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</main>
