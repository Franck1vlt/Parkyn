<app-header />
<main class="min-h-screen py-8 pw-4 bg-gray-100">
  <div class="max-w-4xl mx-auto">
    <!-- Bouton retour -->
    <button
      type="button"
      routerLink="/"
      class="flex items-center gap-2 mb-6 text-gray-600 hover:text-orange-600 hover:bg-orange-100 transition-colors py-2 px-3 rounded-2xl border-2"
    >
      <svg
        class="w-6 h-6"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 8 14"
      >
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M7 1 1.3 6.326a.91.91 0 0 0 0 1.348L7 13"
        />
      </svg>
      Retour à l'accueil
    </button>

    <!-- Header du profil -->
    <div class="bg-white rounded-2xl shadow-lg overflow-hidden mb-6">
      <!-- Bandeau -->
      <div class="z-0 h-36 bg-gradient-to-r from-blue-900 to-teal-400 relative overflow-hidden">
        <div
          class="absolute -top-6 left-1/3 w-40 h-40 bg-teal-300 rounded-full opacity-40 blur-3xl"
        ></div>
        <div
          class="absolute top-4 right-1/4 w-48 h-48 bg-blue-400 rounded-full opacity-30 blur-3xl"
        ></div>
        <div
          class="absolute -bottom-8 left-1/2 w-36 h-36 bg-cyan-300 rounded-full opacity-50 blur-2xl"
        ></div>
      </div>

      <!-- Contenu centré -->
      <div class="relative z-10 flex flex-col items-center -mt-12 pb-8 px-6">
        <!-- Avatar -->
        <div
          class="w-24 h-24 rounded-full border-4 border-white shadow-lg flex items-center justify-center text-white text-3xl font-bold"
          [ngClass]="roleAccentColor"
        >
          {{ initials }}
        </div>

        <!-- Nom -->
        <h1 class="mt-3 text-2xl font-bold text-gray-800">{{ userName }}</h1>

        <!-- Badge rôle -->
        <span
          [class]="
            'mt-1 inline-block px-3 py-1 rounded-full text-sm font-semibold border ' +
            roleBadgeColor
          "
        >
          {{ userRole }}
        </span>

        <!-- Email -->
        <p class="mt-2 text-gray-500 text-sm">{{ userEmail }}</p>
      </div>
    </div>
  </div>
</main>
