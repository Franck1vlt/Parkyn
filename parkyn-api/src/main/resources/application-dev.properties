# Profil dev : s'ajoute à application.properties (n'écrase que ce qui est redéfini ici).
# Activation : --spring.profiles.active=dev ou SPRING_PROFILES_ACTIVE=dev

# Requêtes SQL indentées (affichées via le logger Hibernate, sans show-sql pour éviter le doublon)
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# Valeurs des paramètres des requêtes : peut contenir des données sensibles (emails, hash), jamais en production
logging.level.org.hibernate.orm.jdbc.bind=TRACE
