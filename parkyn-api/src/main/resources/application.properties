spring.application.name=parkyn-api
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-days=${REFRESH_EXPIRATION_DAYS:1}

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.baseline-on-migrate=true
server.port=8080
springdoc.swagger-ui.persistAuthorization=true

spring.cache.type=caffeine
spring.cache.cache-names=userPermissions
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=60s

spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# Hachage des mots de passe : Argon2id (recommandation OWASP : 19 Mio, 2 itérations, parallélisme 1).
# A ajuster selon le serveur : viser 200 à 500 ms par hash, mesurés sur la machine de production.
# Mémoire consommée ~ memory-kib x connexions simultanées : à prendre en compte dans le dimensionnement.
# Modifier ces valeurs ne casse rien : chaque hash garde ses propres paramètres.
parkyn.security.argon2.memory-kib=${ARGON2_MEMORY_KIB:19456}
parkyn.security.argon2.iterations=${ARGON2_ITERATIONS:2}
parkyn.security.argon2.parallelism=${ARGON2_PARALLELISM:1}

# Mail configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

parkyn.mail.from=${MAIL_FROM:no-reply@parkyn.app}
parkyn.frontend-url=${FRONTEND_URL:http://localhost}

# Pool d'envoi des emails (threads email-*). Le pool garde core-size threads, met les envois
# suivants en file, et ne monte vers max-size que quand la file est pleine. File pleine et
# max-size atteint : l'envoi est refusé (TaskRejectedException, journalisée par EmailEventListener).
parkyn.mail.async.core-size=${MAIL_ASYNC_CORE_SIZE:2}
parkyn.mail.async.max-size=${MAIL_ASYNC_MAX_SIZE:4}
parkyn.mail.async.queue-capacity=${MAIL_ASYNC_QUEUE_CAPACITY:100}

# Garde l'exécuteur par défaut de Spring Boot à côté d'emailExecutor (sinon un @Async sans nom
# ou l'async MVC utiliseraient un exécuteur sans limite de threads)
spring.task.execution.mode=force

# Adresse utilisée par JavaMail pour le Message-ID : évite la résolution DNS lente du nom de la machine
spring.mail.properties.mail.from=${parkyn.mail.from}

